apiVersion: batch/v1
kind: CronJob
metadata:
  name: leadership-report-agent
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: openshell
    app.kubernetes.io/component: leadership-report
spec:
  # Every Wednesday at 18:00 UTC
  schedule: "0 18 * * 3"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A new pod cannot reconcile an uncertain write from an earlier run.
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/part-of: openshell
            app.kubernetes.io/component: leadership-report
        spec:
          serviceAccountName: openshell-sandbox
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: Never
          containers:
            - name: launcher
              image: quay.io/rh-ee-evhoward/openshell-launcher:latest
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TLS_DIR="/tmp/openshell-config/openshell/gateways/openshift/mtls"
                  case "${LEADERSHIP_DOC_ID}" in
                    ''|*[!A-Za-z0-9_-]*)
                      echo "Invalid LEADERSHIP_DOC_ID" >&2
                      exit 1
                      ;;
                  esac
                  mkdir -p "${TLS_DIR}"
                  cp /gateway-tls/ca.crt "${TLS_DIR}/ca.crt"
                  cp /gateway-tls/tls.crt "${TLS_DIR}/tls.crt"
                  cp /gateway-tls/tls.key "${TLS_DIR}/tls.key"

                  export XDG_CONFIG_HOME="/tmp/openshell-config"
                  export OPENSHELL_GATEWAY="openshift"
                  export OPENSHELL_GATEWAY_ENDPOINT="https://openshell.openshell.svc.cluster.local:8080"
                  sed -e "s|__DOC_ID__|${LEADERSHIP_DOC_ID}|g" \
                    /config/sandbox-policy.yaml.tmpl > /tmp/sandbox-policy.yaml

                  exec openshell sandbox create \
                    --from="${AGENT_IMAGE}" \
                    --name="lr-$(date +%m%d%H%M%S)" \
                    --policy=/tmp/sandbox-policy.yaml \
                    --provider="google-drive-docs" \
                    --provider="leadership-report-enmaas" \
                    --no-keep \
                    --env="MODEL_ID=${MODEL_ID}" \
                    --env="LEADERSHIP_DOC_ID=${LEADERSHIP_DOC_ID}" \
                    --env="MEETING_NAME=${MEETING_NAME}" \
                    --env="GOOGLE_QUOTA_PROJECT=${GOOGLE_QUOTA_PROJECT}" \
                    --env="OPENAI_BASE_URL=https://api.enmaas.devshift.net/v1" \
                    -- python3 /app/agent.py
              env:
                - name: AGENT_IMAGE
                  value: "quay.io/rh-ee-evhoward/leadership-report-agent:latest"
                - name: LEADERSHIP_DOC_ID
                  valueFrom:
                    secretKeyRef:
                      name: leadership-report-config
                      key: doc-id
                - name: MODEL_ID
                  valueFrom:
                    secretKeyRef:
                      name: leadership-report-config
                      key: model-id
                - name: MEETING_NAME
                  valueFrom:
                    secretKeyRef:
                      name: leadership-report-config
                      key: meeting-name
                - name: GOOGLE_QUOTA_PROJECT
                  valueFrom:
                    secretKeyRef:
                      name: leadership-report-config
                      key: gcp-project
              volumeMounts:
                - name: sandbox-policy
                  mountPath: /config
                  readOnly: true
                - name: gateway-tls
                  mountPath: /gateway-tls
                  readOnly: true
                - name: launcher-tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: sandbox-policy
              configMap:
                name: leadership-report-policy
            - name: gateway-tls
              secret:
                secretName: openshell-client-tls
            - name: launcher-tmp
              emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: leadership-report-policy
  namespace: openshell
  labels:
    app.kubernetes.io/part-of: openshell
    app.kubernetes.io/component: leadership-report
data:
  # __DOC_ID__ is replaced at runtime by the launcher from the secret
  sandbox-policy.yaml.tmpl: |
    version: 1

    filesystem_policy:
      include_workdir: true
      read_only:
        - /usr
        - /lib
        - /lib64
        - /etc
        - /app
        - /opt
        - /var/log
        - /proc/self
        - /dev/urandom
      read_write:
        - /sandbox
        - /tmp
        - /dev/null

    landlock:
      compatibility: hard_requirement

    process:
      run_as_user: sandbox
      run_as_group: sandbox

    network_policies:
      google_drive:
        name: Google Drive API (read-only)
        endpoints:
          - host: www.googleapis.com
            port: 443
            protocol: rest
            enforcement: enforce
            credential_binding:
              provider: google-drive-docs
            rules:
              - allow:
                  method: GET
                  path: /drive/v3/files
              - allow:
                  method: GET
                  path: /drive/v3/files/**
        binaries:
          - path: /app/.venv/bin/python*
          - path: /usr/bin/python*
          - path: /usr/local/bin/python*

      google_docs:
        name: Google Docs API (single doc)
        endpoints:
          - host: docs.googleapis.com
            port: 443
            protocol: rest
            enforcement: enforce
            credential_binding:
              provider: google-drive-docs
            rules:
              - allow:
                  method: GET
                  path: /v1/documents/__DOC_ID__
              - allow:
                  method: POST
                  path: /v1/documents/__DOC_ID__:batchUpdate
        binaries:
          - path: /app/.venv/bin/python*
          - path: /usr/bin/python*
          - path: /usr/local/bin/python*

      enmaas:
        name: EnMaaS inference endpoint
        endpoints:
          - host: api.enmaas.devshift.net
            port: 443
            protocol: rest
            enforcement: enforce
            rules:
              - allow:
                  method: POST
                  path: /v1/chat/completions
        binaries:
          - path: /app/.venv/bin/python*
          - path: /usr/bin/python*
          - path: /usr/local/bin/python*
          - path: /opt/app-root/bin/python*



