id: leadership-report-enmaas
display_name: Leadership Report EnMaaS
description: OpenAI-compatible EnMaaS endpoint for the Leadership Report Agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: EnMaaS API key
    env_vars: [OPENAI_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: api.enmaas.devshift.net
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow:
          method: POST
          path: /v1/chat/completions

binaries:
  - /app/.venv/bin/python*
  - /usr/bin/python*
  - /usr/local/bin/python*
  - /opt/app-root/bin/python*
